[project]
name = "higgsfield-mcp"
version = "0.1.0"
description = "MCP server exposing every Higgsfield API endpoint (84 image/video models + request lifecycle + uploads + docs) as callable tools"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10", "httpx>=0.27"]

[project.scripts]
higgsfield-mcp = "higgsfield_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/higgsfield_mcp"]

[dependency-groups]
dev = ["pytest>=8"]
